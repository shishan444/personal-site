services:
  atelier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atelier-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      APP_URL: ${APP_URL:-https://atelier.com}
      NEXT_PUBLIC_SITE_NAME: ATELIER
      NEXT_PUBLIC_DEFAULT_LOCALE: zh
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atelier-net

  postgres:
    image: postgres:16-alpine
    container_name: atelier-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atelier}
    volumes:
      - atelier_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelier} -d ${POSTGRES_DB:-atelier}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atelier-net

volumes:
  atelier_pg_data:
    name: atelier_pg_data

networks:
  atelier-net:
    name: atelier-net
