# /etc/nginx/sites-available/atelier.conf
# sudo ln -s /etc/nginx/sites-available/atelier.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name atelier.com www.atelier.com;
    return 301 https://atelier.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name atelier.com;

    ssl_certificate /etc/letsencrypt/live/atelier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atelier.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Next.js App (PM2 监听 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # uploads 目录（用户上传文件静态服务）
    location /uploads/ {
        alias /var/atelier/app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 静态资源
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
}
