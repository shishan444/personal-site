name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests + coverage gate
        run: pnpm test:unit
      - name: Build
        run: pnpm build
